name: feishu-interface

x-risk-backend: &risk-backend
  build:
    context: ../src/backend
    dockerfile: Dockerfile
  image: enterprise-risk-backend:20261104-zhidun
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@risk-db:5432/${POSTGRES_DB}
    SEED_DEMO_DATA: "false"
    TZ: Asia/Shanghai
  volumes:
    - risk_runtime_data:/app/data
  restart: unless-stopped
  networks:
    - feishu-interface-net

services:
  risk-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - risk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - feishu-interface-net

  risk-migrate:
    profiles: [migration]
    <<: *risk-backend
    command: ["python", "scripts/migrate_sqlite_to_postgres.py"]
    restart: "no"
    depends_on:
      risk-db:
        condition: service_healthy

  risk-backend:
    <<: *risk-backend
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      risk-db:
        condition: service_healthy

  risk-frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    image: enterprise-risk-frontend:20261104-zhidun
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: Asia/Shanghai
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - feishu-interface-net

  risk-gateway:
    image: nginx:stable-alpine
    ports:
      - "${BIND_IP:-127.0.0.1}:${PUBLIC_PORT:-8082}:80"
    volumes:
      - ./nginx/zhidun.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - feishu-interface-net
    depends_on:
      risk-backend:
        condition: service_healthy
      risk-frontend:
        condition: service_healthy

networks:
  feishu-interface-net:
    driver: bridge

volumes:
  risk_postgres_data:
    name: feishu-interface-risk-postgres
  risk_runtime_data:
    name: feishu-interface-risk-runtime
