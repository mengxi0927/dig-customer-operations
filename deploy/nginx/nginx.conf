limit_req_zone $binary_remote_addr zone=l2c_api_limit:10m rate=5r/s;

log_format security '$remote_addr - $request_id [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 60s;
    limit_req_status 429;

    access_log /var/log/nginx/access.log security;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    # Existing customer-standardization endpoints remain on the same domain.
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://customer-app:8000;
        include /etc/nginx/proxy_params;
    }

    location = /ready {
        limit_except GET { deny all; }
        proxy_pass http://customer-app:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/feishu/customer-search {
        limit_except POST { deny all; }
        limit_req zone=l2c_api_limit burst=10 nodelay;
        proxy_pass http://customer-app:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/feishu/customer-business-info {
        limit_except POST { deny all; }
        limit_req zone=l2c_api_limit burst=10 nodelay;
        proxy_pass http://customer-app:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/feishu/customer-confirm {
        limit_except POST { deny all; }
        limit_req zone=l2c_api_limit burst=10 nodelay;
        proxy_pass http://customer-app:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/admin/qcc-usage {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        limit_except GET { deny all; }
        proxy_pass http://customer-app:8000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=l2c_api_limit burst=20 nodelay;
        proxy_pass http://risk-backend:5001;
        include /etc/nginx/proxy_params;
    }

    location /_next/ {
        proxy_pass http://risk-frontend:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://risk-frontend:3000;
        include /etc/nginx/proxy_params;
    }
}
